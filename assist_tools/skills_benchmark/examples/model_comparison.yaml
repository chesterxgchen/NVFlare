# Example scenario: compare two models of the same agent, skills enabled.
#
#   ./bin/run.sh scenario examples/model_comparison.yaml --output-dir /path/to/result-root
#
# Edit `prompt`, `jobs[].path`, and the model names before running.

name: codex model comparison

prompt: ./prompt.txt
repeat_count: 1
fail_fast: false

agents:
  - name: codex

workflows:
  - name: fedavg

jobs:
  - name: ames
    path: /path/to/job-folder
    scale: small

# model_comparison fixes the agent + mode and expands over `models`.
comparison:
  type: model_comparison
  agent: codex
  mode: with_skills
  models:
    - gpt-5-codex
    - gpt-5
